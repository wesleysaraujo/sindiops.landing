<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Favicon: a mesma marca do app (AppLogoIcon.vue), sobre o papel da paleta.

    Cores fixas, e não `var(--azul-caneta)`: favicon é renderizado pelo
    navegador fora do documento, onde as variáveis do tema não existem.

    O fundo claro é deliberado — sem ele, a folha azul sobre a aba escura de
    um navegador em tema escuro perderia a silhueta.
  -->
  <rect width="100" height="100" rx="20" fill="#fefdfb"/>
  <path d="M24 20C24 17.7909 25.7909 16 28 16H58L74 32V78C74 80.2091 72.2091 82 70 82H28C25.7909 82 24 80.2091 24 78V20Z" fill="#1e3fae"/>
  <path d="M58 16V32H74" fill="#ffffff" opacity="0.35"/>
  <rect x="32" y="27" width="16" height="4" rx="1" fill="#ffffff"/>
  <rect x="32" y="35" width="22" height="4" rx="1" fill="#ffffff"/>
  <rect x="32" y="43" width="12" height="4" rx="1" fill="#ffffff"/>
  <circle cx="58" cy="58" r="18" fill="#ffffff" stroke="#1e3fae" stroke-width="6"/>
  <text x="58" y="58" font-size="20" font-weight="bold" font-family="Georgia, 'Times New Roman', serif" fill="#1e3fae" text-anchor="middle" dominant-baseline="central">§</text>
